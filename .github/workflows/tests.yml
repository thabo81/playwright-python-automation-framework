name: Playwright Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    # Prevent a hung browser/test process from running indefinitely.
    timeout-minutes: 60

    # Use a GitHub-hosted Linux runner.
    runs-on: ubuntu-latest

    steps:
      # Check out the repository so the runner can access the test framework.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install the Python runtime used by this CI job.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Install Node.js because Allure Report 3 is distributed through npm.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Install the Python packages used by the automation framework.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Install Chromium and the Linux system dependencies it requires.
      - name: Install Playwright Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      # Install the Allure Report 3 CLI used to build the HTML report.
      - name: Install Allure Report CLI
        run: npm install -g allure

      # Run the test suite with two workers.
      # pytest.ini automatically writes Allure results and retains traces on failure.
      - name: Run tests
        run: pytest --browser chromium --numprocesses 2

      # Build the HTML report even when one or more tests fail.
      - name: Generate Allure report
        if: ${{ always() }}
        run: allure generate ./allure-results

      # Upload the generated HTML report for inspection in GitHub Actions.
      - name: Upload Allure report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # Upload raw Allure result files and Playwright diagnostics.
      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-evidence
          path: |
            allure-results/
            test-results/
          retention-days: 30
